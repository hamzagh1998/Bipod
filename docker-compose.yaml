services:
  cosyvoice:
    build:
      context: .
      dockerfile: docker/Dockerfile.cosyvoice
      args:
        TORCH_VERSION: ${COACH_COSYVOICE_TORCH_VERSION:-2.5.1}
        TORCH_INDEX_URL: ${COACH_COSYVOICE_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: bipod_cosyvoice
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - HF_HOME=/app/data/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - MODELSCOPE_CACHE=/app/data/modelscope
      - COACH_COSYVOICE_MODEL_ID=${COACH_COSYVOICE_MODEL_ID:-iic/CosyVoice-300M}
      - COACH_COSYVOICE_DEVICE=${COACH_COSYVOICE_DEVICE:-auto}
      - COACH_COSYVOICE_LOCAL_FILES_ONLY=${COACH_COSYVOICE_LOCAL_FILES_ONLY:-false}
      - COACH_COSYVOICE_DOWNLOAD_ROOT=/app/data/modelscope
      - COACH_RUNTIME_PROFILE=${COACH_RUNTIME_PROFILE:-auto}
      - COACH_HIGH_VRAM_THRESHOLD_GB=${COACH_HIGH_VRAM_THRESHOLD_GB:-16}
      - COACH_ALLOCATION_POLICY=${COACH_ALLOCATION_POLICY:-auto_balance}
      - COACH_VOICE_LIBRARY_DIR=/app/data/coach_voice_library
    volumes:
      - ./data:/app/data
      - ./cosyvoice/assets:/app/data/coach_voice_library:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  openvoice:
    build:
      context: .
      dockerfile: docker/Dockerfile.openvoice
      args:
        TORCH_VERSION: ${COACH_OPENVOICE_TORCH_VERSION:-2.5.1}
        TORCH_INDEX_URL: ${COACH_OPENVOICE_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: bipod_openvoice
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - COACH_OPENVOICE_MODEL_ID=${COACH_OPENVOICE_MODEL_ID:-openvoice-v2}
      - COACH_OPENVOICE_DEVICE=${COACH_OPENVOICE_DEVICE:-auto}
      - COACH_OPENVOICE_LOCAL_FILES_ONLY=${COACH_OPENVOICE_LOCAL_FILES_ONLY:-false}
      - COACH_OPENVOICE_DOWNLOAD_ROOT=${COACH_OPENVOICE_DOWNLOAD_ROOT:-/app/data/openvoice}
      - COACH_OPENVOICE_CHECKPOINTS_URL=${COACH_OPENVOICE_CHECKPOINTS_URL:-}
      - COACH_VOICE_LIBRARY_DIR=/app/data/coach_voice_library
    volumes:
      - ./data:/app/data
      - ./cosyvoice/assets:/app/data/coach_voice_library:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: bipod_ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  imagine:
    build:
      context: ./imagine
      dockerfile: ../docker/Dockerfile.imagine
    container_name: bipod_imagine
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - HF_HOME=/app/models
      - HF_TOKEN=${HF_TOKEN}
      - OFFLINE_MODE=${OFFLINE_MODE:-true}
    volumes:
      - ./imagine:/app
      - ./data/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  languagetool:
    image: silviof/docker-languagetool:latest
    container_name: bipod_languagetool
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - langtool_languageModel=/ngrams
      - Java_Xms=256m
      - Java_Xmx=1024m

  bipod-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: bipod_brain
    restart: unless-stopped
    depends_on:
      - cosyvoice
      - openvoice
      - ollama
      - imagine
      - languagetool
    ports:
      - "4444:4444"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_IMAGINE=true
      - IMAGINE_API_URL=http://imagine:3333
      - PYTHON_JIT=${PYTHON_JIT:-on}
      - HF_HOME=/app/data/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - COACH_WHISPER_MODEL=${COACH_WHISPER_MODEL:-auto}
      - COACH_WHISPER_FAST_MODEL=${COACH_WHISPER_FAST_MODEL:-auto}
      - COACH_WHISPER_ACCURATE_MODEL=${COACH_WHISPER_ACCURATE_MODEL:-auto}
      - COACH_WHISPER_ENABLE_ACCURATE_RETRY=${COACH_WHISPER_ENABLE_ACCURATE_RETRY:-auto}
      - COACH_WHISPER_RETRY_CONFIDENCE_THRESHOLD=${COACH_WHISPER_RETRY_CONFIDENCE_THRESHOLD:-0.45}
      - COACH_WHISPER_LOCAL_FILES_ONLY=${COACH_WHISPER_LOCAL_FILES_ONLY:-true}
      - COACH_WHISPER_DOWNLOAD_ROOT=/app/data/huggingface/hub
      - COACH_WHISPER_DEVICE=${COACH_WHISPER_DEVICE:-auto}
      - COACH_TTS_PROVIDER=${COACH_TTS_PROVIDER:-cosyvoice}
      - COACH_TTS_ALLOW_ESPEAK_FALLBACK=${COACH_TTS_ALLOW_ESPEAK_FALLBACK:-true}
      - COACH_COSYVOICE_BASE_URL=http://cosyvoice:5001
      - COACH_COSYVOICE_MODEL_ID=${COACH_COSYVOICE_MODEL_ID:-iic/CosyVoice-300M}
      - COACH_COSYVOICE_DEVICE=${COACH_COSYVOICE_DEVICE:-auto}
      - COACH_COSYVOICE_LOCAL_FILES_ONLY=${COACH_COSYVOICE_LOCAL_FILES_ONLY:-true}
      - COACH_COSYVOICE_DOWNLOAD_ROOT=/app/data/huggingface/hub
      - COACH_COSYVOICE_TIMEOUT_SEC=${COACH_COSYVOICE_TIMEOUT_SEC:-1800}
      - COACH_OPENVOICE_BASE_URL=http://openvoice:5002
      - COACH_OPENVOICE_MODEL_ID=${COACH_OPENVOICE_MODEL_ID:-openvoice-v2}
      - COACH_OPENVOICE_DEVICE=${COACH_OPENVOICE_DEVICE:-auto}
      - COACH_OPENVOICE_LOCAL_FILES_ONLY=${COACH_OPENVOICE_LOCAL_FILES_ONLY:-false}
      - COACH_OPENVOICE_DOWNLOAD_ROOT=${COACH_OPENVOICE_DOWNLOAD_ROOT:-/app/data/openvoice}
      - COACH_OPENVOICE_TIMEOUT_SEC=${COACH_OPENVOICE_TIMEOUT_SEC:-1800}
      - COACH_RUNTIME_PROFILE=${COACH_RUNTIME_PROFILE:-auto}
      - COACH_HIGH_VRAM_THRESHOLD_GB=${COACH_HIGH_VRAM_THRESHOLD_GB:-16}
      - COACH_ALLOCATION_POLICY=${COACH_ALLOCATION_POLICY:-auto_balance}
      - COACH_VOICE_LIBRARY_DIR=/app/data/coach_voice_library
      - COACH_LANGUAGETOOL_ENABLED=${COACH_LANGUAGETOOL_ENABLED:-false}
      - COACH_LANGUAGETOOL_BASE_URL=http://languagetool:8010
      - COACH_LANGUAGETOOL_TIMEOUT_SEC=${COACH_LANGUAGETOOL_TIMEOUT_SEC:-6}
      - COACH_ENABLE_TWO_PASS_VOICE=${COACH_ENABLE_TWO_PASS_VOICE:-true}
      - COACH_OLLAMA_KEEPALIVE=${COACH_OLLAMA_KEEPALIVE:-15m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - "/dev/snd:/dev/snd"
      - "/dev/video0:/dev/video0"
    group_add:
      - audio
      - video
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./cosyvoice/assets:/app/data/coach_voice_library:ro
      - /:/host:rw

networks:
  default:
    name: bipod-network
